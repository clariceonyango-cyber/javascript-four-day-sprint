
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 3 - Interactive Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      background: #f5f6fa;
      color: #222;
    }

    main {
      background: white;
      padding: 24px;
      border-radius: 10px;
    }

    input, select, button {
      padding: 10px;
      margin: 5px 0;
      font: inherit;
    }

    input, select {
      max-width: 100%;
    }

    button {
      cursor: pointer;
    }

    li {
      padding: 12px;
      margin: 10px 0;
      background: #f0f2f5;
      border-radius: 6px;
    }

    li.completed .task-title {
      text-decoration: line-through;
      color: #666;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #176b35;
    }

    :focus-visible {
      outline: 3px solid #2457c5;
      outline-offset: 3px;
    }

    .task-actions {
      display: inline-flex;
      gap: 8px;
      margin-left: 10px;
    }
  </style>
  <script type="module" src="./day3-practice.js" defer></script>
  

</head>
<body>
  <header>
    <h1>Day 3: Interactive Task Manager</h1>
    <p>Practising DOM, events, validation and localStorage.</p>
  </header>

  <main>
    <section aria-labelledby="add-heading">
      <h2 id="add-heading">Add a task</h2>

      <form id="task-form">
        <label for="task-title">Task title</label>
        <input
          type="text"
          id="task-title"
          name="title"
          maxlength="80"
          required
          aria-describedby="title-error"
        >

        <p id="title-error" class="error" aria-live="polite"></p>

        <label for="task-priority">Priority</label>
        <select id="task-priority" name="priority">
          <option value="normal">Normal</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>

        <button type="submit">Add Task</button>
      </form>
    </section>

    <section aria-labelledby="filter-heading">
      <h2 id="filter-heading">Find tasks</h2>

      <label for="search-input">Search tasks</label>
      <input type="search" id="search-input" placeholder="Search by title">

      <label for="status-filter">Filter by status</label>
      <select id="status-filter">
        <option value="all">All</option>
        <option value="open">Open</option>
        <option value="completed">Completed</option>
      </select>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">My tasks</h2>
      <ul id="task-list"></ul>
    </section>

    <p id="app-status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
